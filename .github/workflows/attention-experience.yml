name: Execute the source-owned attention readout

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  run-attention:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Resolve the actual maintained operations
        run: npm ci --ignore-scripts --no-audit --no-fund --fetch-retries=1
      - name: Receive native attention and the original service behavior
        run: npm test
      - name: Print the actual operation inventory
        run: node src/attention-plan.mjs --operations
      - name: Execute the actual attention law over the illustrative input
        run: |
          node src/attention-plan.mjs --run-example > "$RUNNER_TEMP/attention.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r=JSON.parse(readFileSync(process.argv[1], "utf8"));
            console.log("Real metrologic allocation:",JSON.stringify(r.result));
            if (r.operation!=="attention-allocation" ||
                r.result.evidence?.kind!=="signcraft.attention-work-evidence/v1" ||
                JSON.stringify(r.result.readNext)!==JSON.stringify(["understand-the-interface","trace-a-receipt"])) {
              throw new Error("source-owned allocation did not choose its recorded exact optimum");
            }
          ' "$RUNNER_TEMP/attention.json"
      - name: Consume the actual npm tarball from an isolated outside directory
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" > /dev/null
          tarball="$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name '*attention-allocation-readout-service-*.tgz' -print -quit)"
          test -n "$tarball"
          mkdir -p "$RUNNER_TEMP/packed-consumer"
          npm install --prefix "$RUNNER_TEMP/packed-consumer" "$tarball"             --registry=https://registry.561.group/             --ignore-scripts --no-package-lock --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 --loglevel=http
          "$RUNNER_TEMP/packed-consumer/node_modules/.bin/attention-plan" --run-example > "$RUNNER_TEMP/packed.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r=JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (r.operation!=="attention-allocation" ||
                r.result.evidence?.kind!=="signcraft.attention-work-evidence/v1" ||
                JSON.stringify(r.result.readNext)!==JSON.stringify(["understand-the-interface","trace-a-receipt"])) {
              throw new Error("packed external consumer did not execute source-owned attention law");
            }
            console.log("Packed package accepted and executed:", JSON.stringify(r.result));
          ' "$RUNNER_TEMP/packed.json"
